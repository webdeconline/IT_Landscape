services:
  drupal:
    image: drupal:latest
    ports:
      - "8081:80"
    depends_on:
      - db
    volumes:
      - drupal_sites:/var/www/html/sites

  db:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupalpassword
    volumes:
      - drupal_db:/var/lib/mysql

volumes:
  drupal_sites:
  drupal_db: